# Build and publish the eztunes image to GHCR.
#
# The image is linux/amd64 only. The fleet is all x86_64, and a container
# cross-build runs the whole toolchain under QEMU, which is where the
# minutes go. The yt-dlp binary is also fetched per-architecture, so an
# arm64 variant would need the musllinux/aarch64 build and a separate
# verification pass.
#
# Requires: this repo to EXIST on GitHub (it currently has no remote) and
# `packages: write` permission, granted inline below.
name: Build & Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v5

      - name: 🏷️ Version from git
        id: version
        # tag build -> "1.2.3"; branch build -> short sha. Both give `latest`.
        run: |
          V=$(git describe --tags --always 2>/dev/null || echo dev)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: $V"

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Docker Login (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          # GHA layer cache. mode=max exports the BUILDER stage, which is
          # where the bun install and the vite build live - mode=min would
          # only cache the final image layers and save us nothing.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            YTDLP_URL=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_musllinux
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=eztunes
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=YouTube to tagged MP3 tracks
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 🧾 Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
