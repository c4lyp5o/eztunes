# ez standard test workflow: lint, tests and build, plus the Docker image
# built, booted and healthy. Runs on PRs; pushes to development and master
# run it through publish.yml, before anything is published.
name: test

on:
  pull_request:
    branches: [development, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests, build & secret scan
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: 🎞️ Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 📦 Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          cd backend && bun install --frozen-lockfile
          cd ../frontend && bun install --frozen-lockfile
      - name: 🧹 Lint (Biome)
        run: bun run lint
      - name: 🧪 Backend tests
        working-directory: backend
        run: bun test
      - name: 🏗️ Build frontend
        working-directory: frontend
        run: bun run build
      - name: 🔐 Secret scan
        run: |
          ASSIGN="(TOKEN|SECRET|PASSWORD|PASSWD|API_KEY)[A-Z_]*[[:space:]]*=[[:space:]]*[\"']?[A-Za-z0-9_/+-]{20,}"
          FALLBACK="(TOKEN|SECRET|PASSWORD|PASSWD|API_KEY)[A-Z_]*[[:space:]]*\|\|[[:space:]]*[\"']?[A-Za-z0-9_/+-]{20,}"
          HITS=$(git grep -nIE "$ASSIGN|$FALLBACK" -- . ':!.github' \
            | grep -vE '^backend/tests/(auth|server)\.test\.js:[0-9]+:' \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::a credential-shaped literal is present in the tree"
            echo "$HITS"
            exit 1
          fi
          echo "no credential-shaped literals found"

  docker:
    name: Docker image (build, boot, healthy)
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛠️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: eztunes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 🔬 Boot and wait for healthy
        run: |
          set -euo pipefail
          docker run -d --name app -e EZTUNES_API_TOKEN="$(openssl rand -hex 24)" -e EZTUNES_SESSION_SECRET="$(openssl rand -hex 48)" -e EZTUNES_INTERNAL_TOKEN="$(openssl rand -hex 24)" -e AUDD_API_TOKEN=ci-placeholder eztunes:ci
          status=starting
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || { echo "::error::container exited"; exit 1; }
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          test "$(docker exec app id -u)" = "1000"
      - name: 🧾 Container logs
        if: always()
        run: docker logs app || true
