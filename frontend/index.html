<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1d15" />
    <title>ezTunes</title>
    <script>
      /*
       * Set the theme before the first paint.
       *
       * Without this the page would paint the light ground and then swap to
       * the dark one, which is a flash on every load. The choice is read
       * from the same key the toggle writes to.
       */
      (function () {
        try {
          var stored = window.localStorage.getItem("eztunes-theme");
          document.documentElement.dataset.theme =
            stored === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
